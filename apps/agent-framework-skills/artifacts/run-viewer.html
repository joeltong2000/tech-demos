<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Agent Framework skills demo — offline run</title>
  <style>
    :root {
      --bg: #0f1419;
      --fg: #d6e0ea;
      --muted: #7f8b98;
      --accent: #3dd68c;
      --warn: #f0b429;
      --tool: #7cc4fa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(1200px 600px at 10% -10%, #1a2a3a 0%, transparent 55%),
        radial-gradient(900px 500px at 90% 0%, #1b2830 0%, transparent 50%),
        var(--bg);
      color: var(--fg);
      font-family: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
      font-size: 13px;
      line-height: 1.45;
      padding: 28px 32px 48px;
    }
    header {
      max-width: 980px;
      margin: 0 auto 18px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 18px;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    p { margin: 0; color: var(--muted); max-width: 70ch; }
    .term {
      max-width: 980px;
      margin: 0 auto;
      background: #0a0e12;
      border: 1px solid #243040;
      border-radius: 10px;
      box-shadow: 0 18px 50px rgba(0,0,0,.45);
      overflow: hidden;
    }
    .chrome {
      display: flex;
      gap: 7px;
      align-items: center;
      padding: 10px 14px;
      background: #141b22;
      border-bottom: 1px solid #243040;
      color: var(--muted);
      font-size: 12px;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot.r { background: #ff5f57; }
    .dot.y { background: #febc2e; }
    .dot.g { background: #28c840; }
    pre {
      margin: 0;
      padding: 18px 20px 28px;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 420px;
    }
    .ok { color: var(--accent); }
    .hdr { color: var(--warn); font-weight: 600; }
    .tool { color: var(--tool); }
  </style>
</head>
<body>
  <header>
    <h1>Microsoft Agent Framework builder skills — offline CI run</h1>
    <p>All four variants (.NET / Python × baseline / with-skill) calling <code>get_job_status(570213)</code> with a scripted chat client. No API keys.</p>
  </header>
  <div class="term">
    <div class="chrome">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span style="margin-left:10px">apps/agent-framework-skills — AF_CHAT_MODE=scripted</span>
    </div>
    <pre id="out">Loading…</pre>
  </div>
  <script>
    // Embedded at build time by the capture script; fallback fetch for local viewing.
    const EMBEDDED = "======= Microsoft Agent Framework skills demo (offline) =======\n\n=== .NET baseline (without skill) ===\nData: /agent/repos/tech-demos/apps/agent-framework-skills/data/jde-jobs.json\n\nUser: What is the status of job 570213? Include the report id and any error text.\n\n[assistant]\n  tool_call GetJobStatus({\"jobNumber\":570213})\n[tool]\n  tool_result call_baseline_1: {\"jobNumber\":570213,\"reportId\":\"R31410\",\"version\":\"XJDE0003\",\"description\":\"Work Order Processing\",\"status\":\"E\",\"statusLabel\":\"Error\",\"user\":\"MFGUSER\",\"queue\":\"QBATCH\",\"errorText\":\"Work order 451882 failed: branch/plant M30 record invalid (error 0002E).\"}\n[assistant]\n  Job 570213 (R31410 / Work Order Processing) is in Error (E). errorText: Work order 451882 failed: branch/plant M30 record invalid (error 0002E).\n\nFinal: Job 570213 (R31410 / Work Order Processing) is in Error (E). errorText: Work order 451882 failed: branch/plant M30 record invalid (error 0002E).\n\n----------------------------------------------------------------\n\n=== .NET with-skill (agent-framework-builder-dotnet) ===\nData: /agent/repos/tech-demos/apps/agent-framework-skills/data/jde-jobs.json\nChat client: Microsoft.Extensions.AI.ChatClientMetadata\n\nUser: What is the status of job 570213? Include the report id and any error text.\n\n[assistant]\n  tool_call GetJobStatus({\"jobNumber\":570213})\n[tool]\n  tool_result call_skill_1: {\"jobNumber\":570213,\"reportId\":\"R31410\",\"version\":\"XJDE0003\",\"description\":\"Work Order Processing\",\"status\":\"E\",\"statusLabel\":\"Error\",\"user\":\"MFGUSER\",\"queue\":\"QBATCH\",\"errorText\":\"Work order 451882 failed: branch/plant M30 record invalid (error 0002E).\"}\n[assistant]\n  Job 570213 (R31410 / Work Order Processing) is in Error (E). errorText: Work order 451882 failed: branch/plant M30 record invalid (error 0002E).\n\nFinal: Job 570213 (R31410 / Work Order Processing) is in Error (E). errorText: Work order 451882 failed: branch/plant M30 record invalid (error 0002E).\n\n----------------------------------------------------------------\n\n=== Python baseline (without skill) ===\nData: /agent/repos/tech-demos/apps/agent-framework-skills/data/jde-jobs.json\n\nUser: What is the status of job 570213? Include the report id and any error text.\n\n[assistant]\n  tool_call get_job_status({'job_number': 570213})\n[tool]\n  tool_result call_baseline_1: {\"jobNumber\": 570213, \"reportId\": \"R31410\", \"version\": \"XJDE0003\", \"description\": \"Work Order Processing\", \"status\": \"E\", \"statusLabel\": \"Error\", \"user\": \"MFGUSER\", \"queue\": \"QBATCH\", \"errorText\": \"Work order 451882 failed: branch/plant M30 record invalid (error 0002E).\"}\n[assistant]\n  Job 570213 (R31410 / Work Order Processing) is in Error (E). errorText: Work order 451882 failed: branch/plant M30 record invalid (error 0002E).\n\nFinal: Job 570213 (R31410 / Work Order Processing) is in Error (E). errorText: Work order 451882 failed: branch/plant M30 record invalid (error 0002E).\n\n----------------------------------------------------------------\n\n=== Python with-skill (agent-framework-builder-python) ===\nData: /agent/repos/tech-demos/apps/agent-framework-skills/data/jde-jobs.json\nChat client: ScriptedOpsChatClient\n\nUser: What is the status of job 570213? Include the report id and any error text.\n\n[assistant]\n  tool_call get_job_status({'job_number': 570213})\n[tool]\n  tool_result call_skill_1: {\"jobNumber\": 570213, \"reportId\": \"R31410\", \"version\": \"XJDE0003\", \"description\": \"Work Order Processing\", \"status\": \"E\", \"statusLabel\": \"Error\", \"user\": \"MFGUSER\", \"queue\": \"QBATCH\", \"errorText\": \"Work order 451882 failed: branch/plant M30 record invalid (error 0002E).\"}\n[assistant]\n  Job 570213 (R31410 / Work Order Processing) is in Error (E). errorText: Work order 451882 failed: branch/plant M30 record invalid (error 0002E).\n\nFinal: Job 570213 (R31410 / Work Order Processing) is in Error (E). errorText: Work order 451882 failed: branch/plant M30 record invalid (error 0002E).\n\n======= done =======\n";
    async function load() {
      const pre = document.getElementById('out');
      let text = EMBEDDED;
      if (!text) {
        const res = await fetch('./run-output.txt');
        text = await res.text();
      }
      const escaped = text
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      pre.innerHTML = escaped
        .replace(/^(=== .+ ===)$/gm, '<span class="hdr">$1</span>')
        .replace(/^(Final: .+)$/gm, '<span class="ok">$1</span>')
        .replace(/(tool_call .+)$/gm, '<span class="tool">$1</span>')
        .replace(/(tool_result .+)$/gm, '<span class="tool">$1</span>');
    }
    load();
  </script>
</body>
</html>
