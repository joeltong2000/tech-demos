[project]
name = "tradingagents-debate"
version = "0.1.0"
description = "Offline TradingAgents-style multi-agent debate demo (paper trades only)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "colorama>=0.4.6",
]

[project.optional-dependencies]
openai = [
    "openai>=1.40.0",
    "python-dotenv>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
debate = "tradingagents_debate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradingagents_debate"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
